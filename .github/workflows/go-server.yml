name: Go server migration
on:
  push:
    branches: [feature/go-server-unified]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the baseline guard
        run: python -m unittest discover -s scripts/tests -p 'test_go_baseline.py' -v
      - name: Freeze legacy files and inventory routes without starting a server
        run: |
          mkdir -p artifacts
          python scripts/check-go-baseline.py > artifacts/legacy-contracts.json
      - name: Record exact source used for migration verification
        run: git archive --format=zip --output=artifacts/timeweaver-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: go-migration-baseline
          path: artifacts/
          retention-days: 7
  frontend:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client regression tests
        run: node --test client/tests/embedded-config.test.cjs client/tests/*.test.mjs
      - run: npm ci --prefix client
      - name: Preserve the existing standalone build
        run: npm run build --prefix client
      - name: Compile Vue for the embedded Go UI
        env:
          TW_EMBEDDED_BUILD: '1'
        run: npm run build --prefix client
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-vue
          path: internal/webui/assets/dist/
          retention-days: 7
  go:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TW_REQUIRE_EMBEDDED_UI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: embedded-vue
          path: internal/webui/assets/dist/
      - name: Verify committed dependency locks
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate the real embedded Vue bundle
        run: go run ./cmd/timeweaver assets-check --context /timeweaver_svr
      - name: Race and formatting checks
        if: runner.os == 'Linux'
        run: |
          go test -race ./...
          test -z "$(gofmt -l cmd internal)"
      - name: Cross-build migration CLIs (not production servers)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; suffix=""
            if [ "$os" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "artifacts/timeweaver-$os-$arch$suffix" ./cmd/timeweaver
          done
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: go-migration-cli
          path: artifacts/
          retention-days: 7

  store-mysql:
    needs: [baseline, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.4', 'mariadb:11.4']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: migration-ci-only
          MYSQL_ROOT_HOST: '%'
          TZ: Asia/Tokyo
        ports: ['3306:3306']
    env:
      TZ: Asia/Tokyo
      TIMEWEAVER_TEST_MYSQL_ALLOW_CREATE: '1'
      TIMEWEAVER_TEST_MYSQL_HOST: 127.0.0.1
      TIMEWEAVER_TEST_MYSQL_PASSWORD: migration-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed dependency locks
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: actions/download-artifact@v4
        with:
          name: embedded-vue
          path: internal/webui/assets/dist/
      - name: Wait for the disposable database
        shell: bash
        run: |
          for attempt in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: go test -race -count=1 -v ./internal/store ./internal/agentapi ./internal/server ./internal/access
      - run: go build -o artifacts/timeweaver-store ./cmd/timeweaver
      - run: python -m pip install sqloader==0.2.18 'PyMySQL[rsa]==1.1.1' sqlparse==0.5.3 pyjwt==2.10.1 pydantic==2.10.6 passlib==1.7.4 playwright==1.56.0
      - name: Verify legacy-compatible human password hashes
        env:
          TIMEWEAVER_ACCESS_INTEROP: '1'
        run: go test -count=1 -v ./internal/access -run TestPasslibPasswordCompatibility
      - name: Install test-only browser
        run: python -m playwright install chromium
      - name: Exercise human sessions through the real embedded Vue UI
        env:
          TIMEWEAVER_BROWSER_ACCESS: '1'
        run: go test -race -count=1 -timeout=120s -v ./internal/server -run TestBrowserSessionFlow
      - name: Compare Python and Go migrations on disposable databases
        run: python scripts/test-go-store-compat.py artifacts/timeweaver-store
      - name: Cross-check identity with the frozen Python service
        env:
          TIMEWEAVER_IDENTITY_INTEROP: '1'
        run: go test -race -count=1 -v ./internal/agentapi -run TestPythonIdentityInterop
      - name: Checkout pinned agent protocol (test-only)
        uses: actions/checkout@v4
        with:
          repository: horrible-gh/TimeWeaver-Agent
          ref: aa509b196c1caf35cc28b38f8015994da8906819
          path: .agent-contract
          persist-credentials: false
      - name: Compile the actual agent snapshot validator
        shell: bash
        run: |
          mkdir -p .agent-contract/cmd/runtime-contract
          cp scripts/testdata/agent-runtime-validator.go .agent-contract/cmd/runtime-contract/main.go
          (cd .agent-contract && go build -o ../artifacts/agent-runtime-validator ./cmd/runtime-contract)
          (cd .agent-contract && go build -o ../artifacts/timeweaver-agent ./cmd/timeweaver-agent)
      - name: Cross-check snapshots with Python and the actual Go-agent decoder
        env:
          TIMEWEAVER_RUNTIME_INTEROP: '1'
          TW_AGENT_CONTRACT_VALIDATOR: ${{ github.workspace }}/artifacts/agent-runtime-validator
        run: go test -race -count=1 -v ./internal/agentapi -run TestPythonRuntimeInterop
      - name: Cross-deliver execution requests with the frozen Python service
        env:
          TIMEWEAVER_EXECUTION_INTEROP: '1'
        run: go test -race -count=1 -v ./internal/agentapi -run TestPythonExecutionInterop
      - name: Run real Go agent against unified listener
        timeout-minutes: 3
        env:
          TW_AGENT_BINARY: ${{ github.workspace }}/artifacts/timeweaver-agent
          TW_REQUIRE_EMBEDDED_UI: '1'
        run: go test -race -count=1 -timeout=150s -v ./internal/server -run TestGoAgentEndToEnd
      - name: Retain resolved dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-store-dependencies-${{ strategy.job-index }}
          path: |
            go.mod
            go.sum
          retention-days: 7
