name: Server and client tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: timeweaver-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TIMEWEAVER_TEST_MYSQL_HOST: 127.0.0.1
      TIMEWEAVER_TEST_MYSQL_PORT: '3306'
      TIMEWEAVER_TEST_MYSQL_USER: root
      TIMEWEAVER_TEST_MYSQL_PASSWORD: timeweaver-test
      TW_AGENT_CONTRACT_VALIDATOR: ${{ github.workspace }}/artifacts/agent-runtime-validator
      TW_REQUIRE_AGENT_CONTRACT_VALIDATOR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Checkout pinned Go agent protocol (test-only)
        uses: actions/checkout@v4
        with:
          repository: horrible-gh/TimeWeaver-Agent
          ref: ae4778a3b674beb6e8075de5c71ec6facf37008d
          path: .agent-contract
          persist-credentials: false
      - name: Build the actual Go agent snapshot validator
        run: |
          mkdir -p artifacts .agent-contract/cmd/runtime-contract
          cp scripts/testdata/agent-runtime-validator.go .agent-contract/cmd/runtime-contract/main.go
          (cd .agent-contract && go build -o ../artifacts/agent-runtime-validator ./cmd/runtime-contract)
      - run: python -m pip install -r server/requirements.txt pytest
      - run: python -m pytest server/tests -q
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: client
        run: |
          node --test tests/*.test.mjs
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1
