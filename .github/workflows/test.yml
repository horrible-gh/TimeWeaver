name: Server and client tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: timeweaver-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TIMEWEAVER_TEST_MYSQL_HOST: 127.0.0.1
      TIMEWEAVER_TEST_MYSQL_PORT: '3306'
      TIMEWEAVER_TEST_MYSQL_USER: root
      TIMEWEAVER_TEST_MYSQL_PASSWORD: timeweaver-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements.txt apscheduler==3.11.0 requests==2.32.4 pytest
      - run: python -m pytest server/tests -q
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: client
        run: |
          node --test tests/*.test.mjs
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1
